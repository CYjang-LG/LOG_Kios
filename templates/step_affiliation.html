{% extends 'base.html' %}
{% block title %}소속 선택{% endblock %}
{% block extra_style %}
<style>
  .step-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px 20px;
    background: linear-gradient(160deg, #0D2B6B, #2456b8); }
  .step-card { background:#fff; border-radius:24px; padding:44px 40px; width:100%; max-width:700px;
    box-shadow: 0 20px 60px rgba(13,43,107,0.25); }
  .step-header { display:flex; align-items:center; gap:14px; margin-bottom:32px; }
  .step-num { background:var(--inha-blue); color:#fff; width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.95rem; flex-shrink:0; }
  .step-header h1 { font-size:1.5rem; font-weight:700; color:var(--inha-blue); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:14px; margin-bottom:24px; }
  .choice-btn {
    background:var(--surface-2); border:2px solid var(--border);
    border-radius:var(--radius); padding:22px 16px;
    font-size:1.05rem; font-weight:600; color:var(--text);
    cursor:pointer; transition:all .2s; text-align:center;
  }
  .choice-btn:hover { border-color:var(--inha-blue); background:var(--inha-light); color:var(--inha-blue); transform:translateY(-2px); box-shadow:var(--shadow); }
  .choice-btn:active { transform:translateY(0); }
  .divider { border:none; border-top:1px solid var(--border); margin:20px 0; }
  .custom-row { display:flex; gap:12px; }
  .custom-input {
    flex:1; border:1.5px solid var(--border); border-radius:var(--radius-sm);
    padding:14px 16px; font-size:1rem; color:var(--text); background:var(--surface-2);
    outline:none;
  }
  .custom-input:focus { border-color:var(--inha-blue); }
  .back-row { margin-top:16px; }
</style>
{% endblock %}
{% block body %}
<div class="step-wrap">
  <div class="step-card">
    <div class="step-header">
      <div class="step-num">1</div>
      <h1>소속을 선택해 주세요</h1>
    </div>
    <div class="grid">
      {% for a in affiliations %}
        <a href="{{ url_for('step_department', aff_id=a.id) }}">
          <button class="choice-btn">{{ a.name }}</button>
        </a>
      {% else %}
        <p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:20px 0;">등록된 소속이 없습니다.<br>아래에서 직접 입력해 주세요.</p>
      {% endfor %}
    </div>
    <hr class="divider">
    <div class="custom-row">
      <input class="custom-input" id="customAff" placeholder="직접 입력 (소속 기관명)" autocomplete="off">
      <button class="btn btn-primary" onclick="goCustom()">다음 →</button>
    </div>
    <div class="back-row">
      <a href="{{ url_for('index') }}" class="btn btn-secondary" style="width:100%;margin-top:8px;">← 처음으로</a>
    </div>
  </div>
</div>
{% endblock %}
{% block script %}
<script>
  function goCustom() {
    const val = document.getElementById('customAff').value.trim();
    if (!val) { document.getElementById('customAff').focus(); return; }
    location.href = `{{ url_for('step_form') }}?custom_aff=${encodeURIComponent(val)}`;
  }
  document.getElementById('customAff').addEventListener('keydown', e => { if(e.key==='Enter') goCustom(); });
</script>
{% endblock %}
