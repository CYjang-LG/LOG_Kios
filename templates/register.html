{% extends 'base.html' %}
{% block title %}방문 기록 등록{% endblock %}
{% block extra_style %}
<style>
  .reg-wrap {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 30px 20px;
  }
  .reg-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 44px;
    width: 100%; max-width: 680px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .reg-header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 36px;
  }
  .reg-header h1 { font-size: 1.7rem; font-weight: 700; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted); font-size: .9rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 50px;
    transition: all .2s;
  }
  .back-link:hover { color: var(--text); }
  .form-group { margin-bottom: 22px; }
  .form-label {
    display: block; margin-bottom: 8px;
    font-size: .9rem; font-weight: 600; color: var(--muted);
    letter-spacing: .03em;
  }
  .form-label .req { color: var(--primary); margin-left: 2px; }
  .form-control {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 1.05rem;
    padding: 14px 16px;
    outline: none;
    transition: border-color .2s;
    -webkit-appearance: none;
  }
  .form-control:focus { border-color: var(--primary); }
  .form-control::placeholder { color: var(--muted); }
  .time-row {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px;
    align-items: center;
  }
  .time-sep { color: var(--muted); font-size: 1.2rem; text-align: center; }
  .form-actions {
    display: flex; gap: 14px; margin-top: 32px;
  }
  .form-actions .btn { flex: 1; }
  textarea.form-control { resize: none; min-height: 90px; }
  select.form-control { cursor: pointer; }
  /* 목적 버튼 선택 */
  .purpose-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .purpose-chip {
    padding: 10px 18px;
    border-radius: 50px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: .95rem; cursor: pointer;
    transition: all .2s;
  }
  .purpose-chip.active {
    background: rgba(92,110,248,.2);
    border-color: var(--primary);
    color: var(--text);
    font-weight: 600;
  }
</style>
{% endblock %}
{% block body %}
<div class="reg-wrap">
  <div class="reg-card">
    <div class="reg-header">
      <a href="{{ url_for('index') }}" class="back-link">← 홈</a>
      <h1>✍️ 방문 기록 등록</h1>
    </div>

    <form method="POST" action="{{ url_for('register') }}" id="regForm">

      <!-- 날짜 -->
      <div class="form-group">
        <label class="form-label">날짜 <span class="req">*</span></label>
        <input type="date" name="visit_date" class="form-control"
               value="{{ today }}" required>
      </div>

      <!-- 시간 -->
      <div class="form-group">
        <label class="form-label">방문 시간 <span class="req">*</span></label>
        <div class="time-row">
          <input type="time" name="time_in"  class="form-control" value="09:00" required>
          <div class="time-sep">~</div>
          <input type="time" name="time_out" class="form-control" value="18:00" required>
        </div>
      </div>

      <!-- 이름 -->
      <div class="form-group">
        <label class="form-label">이름 <span class="req">*</span></label>
        <input type="text" name="name" class="form-control"
               placeholder="이름을 입력하세요" required autocomplete="off">
      </div>

      <!-- 소속 -->
      <div class="form-group">
        <label class="form-label">소속 <span class="req">*</span></label>
        <input type="text" name="affiliation" class="form-control"
               placeholder="소속 기관 / 부서" required autocomplete="off">
      </div>

      <!-- 목적 -->
      <div class="form-group">
        <label class="form-label">방문 목적 <span class="req">*</span></label>
        <div class="purpose-btns">
          <button type="button" class="purpose-chip" data-val="업무협의">💼 업무협의</button>
          <button type="button" class="purpose-chip" data-val="연구협력">🔬 연구협력</button>
          <button type="button" class="purpose-chip" data-val="장비사용">🖥 장비사용</button>
          <button type="button" class="purpose-chip" data-val="교육/강의">📚 교육/강의</button>
          <button type="button" class="purpose-chip" data-val="납품/수리">🔧 납품/수리</button>
          <button type="button" class="purpose-chip" data-val="기타">✏️ 직접입력</button>
        </div>
        <input type="text" name="purpose" id="purposeInput" class="form-control"
               placeholder="방문 목적을 선택하거나 직접 입력" required autocomplete="off">
      </div>

      <!-- 기타 -->
      <div class="form-group">
        <label class="form-label">기타 (선택)</label>
        <textarea name="note" class="form-control"
                  placeholder="추가 메모가 있으면 입력하세요"></textarea>
      </div>

      <div class="form-actions">
        <a href="{{ url_for('index') }}" class="btn btn-secondary btn-lg">취소</a>
        <button type="submit" class="btn btn-primary btn-lg">✅ 등록 완료</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block script %}
<script>
  const chips = document.querySelectorAll('.purpose-chip');
  const input = document.getElementById('purposeInput');
  chips.forEach(chip => {
    chip.addEventListener('click', () => {
      chips.forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      if (chip.dataset.val === '기타') {
        input.value = '';
        input.focus();
      } else {
        input.value = chip.dataset.val;
      }
    });
  });
</script>
{% endblock %}
