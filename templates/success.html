{% extends 'base.html' %}
{% block title %}등록 완료{% endblock %}
{% block extra_style %}
<style>
  .success-page {
    min-height: calc(100vh - var(--header-h));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    padding: 40px 32px;
    text-align: center;
  }
  .success-icon-wrap {
    width: 100px; height: 100px;
    background: var(--success-light);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 28px;
    box-shadow: 0 0 0 12px rgba(22,163,74,0.08);
    animation: pop .4s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .success-title {
    font-size: 2rem; font-weight: 900;
    color: var(--navy);
    margin-bottom: 8px;
    letter-spacing: -.02em;
  }
  .success-name {
    font-size: 1.3rem; font-weight: 700;
    color: var(--teal);
    margin-bottom: 16px;
  }
  .success-sub {
    font-size: 1rem;
    color: var(--text-muted);
    line-height: 1.7;
    max-width: 320px;
    margin-bottom: 48px;
  }
  .back-home-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 400px;
    background: var(--navy);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 1.1rem; font-weight: 800;
    padding: 22px 28px;
    border-radius: var(--radius-lg);
    transition: all .2s;
    font-family: inherit;
    box-shadow: 0 8px 28px rgba(13,43,107,0.25);
  }
  .back-home-btn:hover { background: var(--navy-hover); transform: translateY(-2px); }
  .back-home-btn:active { transform: translateY(0); }
  .btn-arrow {
    width: 40px; height: 40px;
    background: rgba(255,255,255,0.18);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .countdown-text {
    margin-top: 20px;
    font-size: .88rem;
    color: var(--text-faint);
  }
  .countdown-text span { font-weight: 700; color: var(--text-muted); }
</style>
{% endblock %}
{% block body %}
<div class="success-page">
  <div class="success-icon-wrap">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <div class="success-title">등록 완료!</div>
  {% if name %}
  <div class="success-name">{{ name }}님</div>
  {% endif %}
  <p class="success-sub">방문 정보가 성공적으로 등록되었습니다.<br>안전하고 즐거운 연구 되세요 😊</p>
  <a href="{{ url_for('index') }}" style="width:100%;max-width:400px;display:block;">
    <button class="back-home-btn">
      <span>처음 화면으로</span>
      <div class="btn-arrow">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </div>
    </button>
  </a>
  <p class="countdown-text"><span id="cdNum">10</span>초 후 자동으로 처음 화면으로 돌아갑니다</p>
</div>
{% endblock %}
{% block script %}
<script>
  let n = 10;
  const el = document.getElementById('cdNum');
  const t = setInterval(() => {
    n--;
    if (el) el.textContent = n;
    if (n <= 0) { clearInterval(t); location.href = '{{ url_for("index") }}'; }
  }, 1000);
</script>
{% endblock %}
