{% extends 'base.html' %}
{% block title %}등록 완료{% endblock %}
{% block extra_style %}
<style>
  .success-wrap {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .success-card {
    background: var(--surface);
    border: 1px solid rgba(34,197,94,.25);
    border-radius: 24px;
    padding: 64px 50px;
    text-align: center;
    max-width: 520px; width: 100%;
    box-shadow: 0 0 60px rgba(34,197,94,.08);
  }
  .success-icon {
    font-size: 80px; margin-bottom: 24px;
    animation: pop .5s cubic-bezier(.175,.885,.32,1.275);
  }
  @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .success-title {
    font-size: 2rem; font-weight: 700; margin-bottom: 12px;
    color: #4ade80;
  }
  .success-name {
    font-size: 1.2rem; color: var(--muted); margin-bottom: 40px;
  }
  .success-name strong { color: var(--text); }
  .countdown { font-size: .9rem; color: var(--muted); margin-top: 20px; }
</style>
{% endblock %}
{% block body %}
<div class="success-wrap">
  <div class="success-card">
    <div class="success-icon">✅</div>
    <h1 class="success-title">등록 완료!</h1>
    <p class="success-name"><strong>{{ name }}</strong>님의 방문 기록이<br>성공적으로 등록되었습니다.</p>
    <a href="{{ url_for('index') }}" class="btn btn-success btn-lg" style="width:100%;">🏠 처음으로 돌아가기</a>
    <p class="countdown" id="countdown">5초 후 자동으로 돌아갑니다</p>
  </div>
</div>
{% endblock %}
{% block script %}
<script>
  let sec = 5;
  const el = document.getElementById('countdown');
  const timer = setInterval(() => {
    sec--;
    el.textContent = `${sec}초 후 자동으로 돌아갑니다`;
    if (sec <= 0) { clearInterval(timer); location.href = '{{ url_for("index") }}'; }
  }, 1000);
</script>
{% endblock %}
