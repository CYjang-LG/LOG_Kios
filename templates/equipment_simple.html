{% extends "base.html" %}

{% block header %}
<h1>장비를 선택하세요</h1>
<p>{{ user_name }}님, 사용할 장비를 선택해주세요</p>
{% endblock %}

{% block content %}
<div class="grid grid-4">
    {% for equipment in equipment_list %}
    <a href="{{ url_for('time_selection', user_name=user_name, equipment_name=equipment.name) }}" class="touch-btn">
        <div>
            <div style="font-size: 1.3em; margin-bottom: 8px;">🔬</div>
            <div style="text-align: center; line-height: 1.2;">{{ equipment.name }}</div>
        </div>
    </a>
    {% endfor %}
</div>

{% if equipment_list|length == 0 %}
<div style="text-align: center; margin-top: 50px;">
    <p style="font-size: 1.3em; color: #666; margin-bottom: 30px;">사용 가능한 장비가 없습니다.</p>
    <a href="{{ url_for('admin') }}" class="touch-btn">관리자 페이지로 이동</a>
</div>
{% endif %}
{% endblock %}
