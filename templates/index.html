{% extends 'base.html' %}
{% block title %}의과학연구소 출입자 기록{% endblock %}
{% block extra_style %}
<style>
  .kiosk-wrap {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px;
    background: linear-gradient(160deg, #0D2B6B 0%, #1a3f8f 50%, #2456b8 100%);
  }
  .kiosk-logo {
    margin-bottom: 10px;
  }
  .kiosk-logo svg { width: 64px; height: 64px; }
  .kiosk-card {
    background: rgba(255,255,255,0.97);
    border-radius: 28px;
    padding: 56px 52px;
    text-align: center;
    max-width: 580px; width: 100%;
    box-shadow: 0 24px 80px rgba(13,43,107,0.35);
  }
  .kiosk-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--inha-light);
    color: var(--inha-blue);
    border-radius: 50px;
    padding: 8px 20px;
    font-size: .88rem; font-weight: 600;
    margin-bottom: 24px;
    letter-spacing: .03em;
  }
  .kiosk-title {
    font-size: 2rem; font-weight: 800;
    color: var(--inha-blue);
    margin-bottom: 8px;
    line-height: 1.3;
  }
  .kiosk-sub { color: var(--muted); font-size: 1rem; margin-bottom: 36px; }
  .kiosk-clock {
    font-size: 2.6rem; font-weight: 700;
    color: var(--inha-blue); letter-spacing: .04em;
    margin-bottom: 4px;
  }
  .kiosk-date {
    color: var(--muted); font-size: 1rem; margin-bottom: 40px;
  }
  .enter-btn {
    width: 100%;
    background: var(--inha-blue);
    color: #fff; border: none; cursor: pointer;
    font-size: 1.35rem; font-weight: 700;
    padding: 26px;
    border-radius: var(--radius);
    box-shadow: 0 8px 32px rgba(13,43,107,0.30);
    transition: all .2s;
    animation: pulse 2.5s ease-in-out infinite;
  }
  .enter-btn:hover { background: var(--inha-blue-2); transform: translateY(-2px); }
  .enter-btn:active { transform: translateY(0); }
  @keyframes pulse {
    0%,100% { box-shadow: 0 8px 32px rgba(13,43,107,0.30); }
    50%      { box-shadow: 0 8px 52px rgba(13,43,107,0.55); }
  }
  .inha-stripe {
    height: 5px;
    background: linear-gradient(90deg, var(--inha-blue), var(--inha-sky));
    border-radius: 5px 5px 0 0;
    margin: -56px -52px 40px;
    border-radius: 28px 28px 0 0;
  }
</style>
{% endblock %}
{% block body %}
<div class="kiosk-wrap">
  <div class="kiosk-card">
    <div class="inha-stripe"></div>
    <div class="kiosk-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      인하대학교 의과학연구소
    </div>
    <h1 class="kiosk-title">출입자 기록</h1>
    <p class="kiosk-sub">방문 전 출입 기록을 등록해 주세요</p>
    <div class="kiosk-clock" id="clock">00:00:00</div>
    <div class="kiosk-date" id="kdate">-</div>
    <a href="{{ url_for('step_affiliation') }}">
      <button class="enter-btn">✍ &nbsp; 방문 기록 등록하기</button>
    </a>
  </div>
</div>
{% endblock %}
{% block script %}
<script>
  const days = ['일','월','화','수','목','금','토'];
  function tick() {
    const n = new Date();
    const pad = x => String(x).padStart(2,'0');
    document.getElementById('clock').textContent =
      `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
    document.getElementById('kdate').textContent =
      `${n.getFullYear()}년 ${pad(n.getMonth()+1)}월 ${pad(n.getDate())}일 (${days[n.getDay()]})`;
  }
  tick(); setInterval(tick, 1000);
  setTimeout(() => location.reload(), 600000);
</script>
{% endblock %}
