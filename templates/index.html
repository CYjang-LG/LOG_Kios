{% extends 'base.html' %}
{% block title %}출입자 기록 키오스크{% endblock %}
{% block extra_style %}
<style>
  .kiosk-wrap {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .kiosk-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 60px 50px;
    text-align: center;
    max-width: 600px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .kiosk-icon { font-size: 72px; margin-bottom: 24px; }
  .kiosk-title {
    font-size: 2.2rem; font-weight: 700;
    margin-bottom: 12px; color: var(--text);
  }
  .kiosk-sub { color: var(--muted); font-size: 1.1rem; margin-bottom: 8px; }
  .kiosk-date {
    display: inline-block;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 8px 24px;
    font-size: 1rem; color: var(--muted);
    margin-bottom: 40px;
  }
  .enter-btn {
    width: 100%;
    font-size: 1.4rem;
    padding: 26px;
    border-radius: var(--radius);
    background: var(--primary);
    color: #fff; border: none; cursor: pointer;
    font-weight: 700;
    box-shadow: 0 8px 30px rgba(92,110,248,.35);
    transition: all .2s;
    margin-bottom: 16px;
  }
  .enter-btn:hover { background: var(--primary-h); transform: translateY(-2px); box-shadow: 0 12px 40px rgba(92,110,248,.45); }
  .enter-btn:active { transform: translateY(0); }
  .pulse {
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 30px rgba(92,110,248,.35); }
    50%       { box-shadow: 0 8px 50px rgba(92,110,248,.65); }
  }
</style>
{% endblock %}
{% block body %}
<div class="kiosk-wrap">
  <div class="kiosk-card">
    <div class="kiosk-icon">🏢</div>
    <h1 class="kiosk-title">출입자 기록</h1>
    <p class="kiosk-sub">방문하신 것을 환영합니다</p>
    <div class="kiosk-date" id="datetime">{{ today }}</div>
    <a href="{{ url_for('register') }}">
      <button class="enter-btn pulse">✍️ &nbsp; 방문 기록 등록하기</button>
    </a>
  </div>
</div>
{% endblock %}
{% block script %}
<script>
  function updateClock() {
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const dateStr = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())}`;
    const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('datetime').textContent = `${dateStr}  ${timeStr}`;
  }
  updateClock();
  setInterval(updateClock, 1000);
  // 10분 후 자동 새로고침
  setTimeout(() => location.reload(), 600000);
</script>
{% endblock %}
