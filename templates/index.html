{% extends 'base.html' %}
{% block title %}의과학연구소 출입자 기록{% endblock %}
{% block extra_style %}
<style>
  .hero {
    min-height: calc(100vh - 56px);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--white);
    padding: 0 24px;
  }
  .hero-inner {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .hero-logo {
    width: 100%;
    margin-bottom: 36px;
  }
  .hero-logo img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
  }
  .hero-date {
    color: var(--muted);
    font-size: 1rem;
    font-weight: 500;
    margin-bottom: 6px;
    text-align: center;
  }
  .hero-clock {
    font-size: 4.5rem;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin-bottom: 48px;
    text-align: center;
  }
  .hero-sub {
    color: var(--muted);
    font-size: .9rem;
    margin-bottom: 28px;
    line-height: 1.6;
    text-align: center;
  }
  .start-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: var(--navy);
    color: #fff;
    border: none;
    cursor: pointer;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 22px 28px;
    border-radius: var(--radius);
    transition: background .18s, transform .15s;
    font-family: inherit;
  }
  .start-btn:hover { background: var(--navy2); transform: translateY(-2px); }
  .start-btn:active { transform: translateY(0); }
  .start-btn-arrow {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--navy), var(--teal));
  }
</style>
{% endblock %}
{% block body %}
<div class="hero">
  <div class="hero-inner">
    <div class="hero-logo">
      <img src="{{ url_for('static', filename='inha_logo.png') }}" alt="인하대학교 로고" loading="eager">
    </div>
    <div class="hero-date" id="kdate"></div>
    <div class="hero-clock" id="clock">--:--:--</div>
    <div class="hero-sub">연구소 출입 전 방문정보를 입력해주세요.</div>
    <a href="{{ url_for('step_affiliation') }}" style="width:100%;display:block;">
      <button class="start-btn">
        <span>방문 기록 등록하기</span>
        <div class="start-btn-arrow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </button>
    </a>
  </div>
</div>
<div class="bottom-bar"></div>
{% endblock %}
{% block script %}
<script>
  const days = ['일','월','화','수','목','금','토'];
  function tick() {
    const n = new Date();
    const pad = x => String(x).padStart(2,'0');
    document.getElementById('clock').textContent = `${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
    document.getElementById('kdate').textContent = `${n.getFullYear()}년 ${pad(n.getMonth()+1)}월 ${pad(n.getDate())}일 (${days[n.getDay()]})`;
  }
  tick(); setInterval(tick, 1000);
  setTimeout(() => location.reload(), 600000);
</script>
{% endblock %}
